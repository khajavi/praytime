name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          # mypy is pinned to <2 in the dev extra: mypy 2.x dropped the Python 3.9
          # target that this port supports (see pyproject.toml [tool.mypy]).
          python -m pip install ruff "mypy<2"

      - name: Lint (ruff)
        run: ruff check praytime tests

      - name: Type-check (mypy)
        run: mypy praytime

      - name: Test (pytest)
        run: python -m pytest -q

  upstream-drift:
    name: Upstream golden drift (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate goldens from the upstream JS library
        run: |
          if [ -f tests/golden/generate.js ]; then
            node tests/golden/generate.js
            git diff --stat -- tests/golden || true
          else
            echo "tests/golden/generate.js not present; skipping drift check."
          fi
